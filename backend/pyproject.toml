[project]
name = "ai-learning-assistant-backend"
version = "0.2.0"
description = "FastAPI backend for the AI Learning Assistant"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.142.2",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Installed (editable) into .venv by `uv sync`, so `app` and `seed` import from any folder.
[tool.hatch.build.targets.wheel]
packages = ["app", "seed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
