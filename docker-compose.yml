# Local development database. Start with: docker compose up -d
# Credentials are for local development only (see backend/.env.example).
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ala
      POSTGRES_PASSWORD: ala
      POSTGRES_DB: ala
    ports:
      - "5432:5432"
    volumes:
      - ala-pgdata:/var/lib/postgresql/data
      - ./backend/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ala -d ala"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  ala-pgdata:
